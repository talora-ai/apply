<!doctype html><html lang="pt-BR"><meta charset="utf-8">
<title>Talora — Brand Sheet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f7;color:#0B1020;font-family:Arial,sans-serif}
main{width:1440px;padding:72px}.head{margin-bottom:42px}.head h1{font-size:42px;margin:0 0 10px}
.head p{color:#64748B;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:#fff;border-radius:24px;padding:34px;min-height:260px;display:flex;align-items:center;justify-content:center}
.dark{background:#0B1020}.card img{max-width:92%;max-height:190px}.colors{grid-column:1/-1;display:flex;gap:16px;align-items:stretch;justify-content:flex-start}
.swatch{width:150px;border-radius:18px;overflow:hidden;background:#fff}.tone{height:110px}.meta{padding:14px;font-weight:700}.meta small{display:block;color:#64748B;margin-top:6px}
</style><main><div class="head"><h1>Talora &amp; Talora Apply</h1>
<p>Marca-mãe e assinatura do primeiro produto.</p></div><section class="grid">
<div class="card"><img src="talora/talora-horizontal.svg"></div>
<div class="card dark"><img src="talora/talora-horizontal-negative.svg"></div>
<div class="card"><img src="talora-apply/talora-apply-horizontal.svg"></div>
<div class="card dark"><img src="talora-apply/talora-apply-horizontal-negative.svg"></div>
<div class="card"><img src="talora/talora-vertical.svg"></div>
<div class="card"><img src="talora-apply/talora-apply-vertical.svg"></div>
<div class="card colors">
<div class="swatch"><div class="tone" style="background:#6D4AFF"></div><div class="meta">Purple 500<small>#6D4AFF</small></div></div>
<div class="swatch"><div class="tone" style="background:#15D0A5"></div><div class="meta">Apply<small>#15D0A5</small></div></div>
<div class="swatch"><div class="tone" style="background:#0B1020"></div><div class="meta">Ink<small>#0B1020</small></div></div>
<div class="swatch"><div class="tone" style="background:#161C2D"></div><div class="meta">Surface<small>#161C2D</small></div></div>
<div class="swatch"><div class="tone" style="background:#F1F5F9"></div><div class="meta">Canvas<small>#F1F5F9</small></div></div>
</div></section></main></html>
